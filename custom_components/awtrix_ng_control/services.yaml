# Replace only the existing `say:` section in services.yaml with this block.
# No top-level `target:`: it would force Home Assistant to require a target.
say:
  fields:
    device_id:
      selector:
        device:
          integration: awtrix_ng_control
    device:
      example: tc002
      selector:
        text: {}
    engine:
      required: true
      selector:
        entity:
          domain: tts
    message:
      required: true
      selector:
        text:
          multiline: true
    language:
      selector:
        text: {}
    cache:
      default: true
      selector:
        boolean: {}
    options:
      selector:
        object: {}
